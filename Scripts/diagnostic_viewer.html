<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReplyKit 診斷檢視器</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111318;
    --panel: #191c23;
    --panel-2: #20242d;
    --border: #303641;
    --text: #e7eaf0;
    --muted: #9aa3b2;
    --accent: #6ea8fe;
    --warn: #f0b429;
    --error: #ff6b6b;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { flex: none; padding: 18px 22px; border-bottom: 1px solid var(--border);
           background: linear-gradient(180deg, #1b2029, #141820); }
  header h1 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); flex: 1; min-height: 0; overflow: hidden; }
  aside { min-height: 0; overflow: auto; overscroll-behavior: contain; border-right: 1px solid var(--border); padding: 14px; background: var(--panel); }
  aside h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .06em;
             text-transform: uppercase; color: var(--muted); }
  button.cat { display: flex; justify-content: space-between; width: 100%;
         padding: 7px 9px; margin: 2px 0; border: 0; border-radius: 7px;
         background: transparent; color: var(--text); cursor: pointer; text-align: left; }
  button.cat:hover { background: var(--panel-2); }
  button.cat.active { background: #2a3a55; color: #dbe8ff; }
  button.cat .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  /* 僅紀錄區捲動，搜尋與統計不隨長日誌離開畫面。 */
  main { padding: 16px; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .controls { flex: none; max-height: 45%; overflow: auto; }
  .log-scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
  .status { flex: none; }
  select { max-width: 100%; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 10px; margin-bottom: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 10px 12px; }
  .card .label { color: var(--muted); font-size: 11px; }
  .card .value { font-size: 18px; font-weight: 600; margin-top: 3px;
                 overflow-wrap: anywhere; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
             margin-bottom: 10px; }
  input[type="search"], select { background: var(--panel-2); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  input[type="search"] { min-width: 260px; flex: 1 1 320px; }
  .pill { border: 1px solid var(--border); background: var(--panel-2);
          color: var(--muted); border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  .pill.active { border-color: var(--accent); color: var(--accent); }
  .range { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .range input { background: var(--panel-2); color: var(--text);
                 border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  .status { color: var(--muted); font-size: 12px; margin: 8px 0; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { padding: 8px 9px; border-bottom: 1px solid var(--border);
           vertical-align: top; text-align: left; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted);
       font-size: 11px; font-weight: 600; z-index: 1; }
  td.time { white-space: nowrap; color: var(--muted); font-size: 12px; width: 150px; }
  td.cat { width: 170px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
           font-size: 12px; color: var(--accent); overflow-wrap: anywhere; }
  td.msg { overflow-wrap: anywhere; }
  mark { background: #f6d365; color: #111318; padding: 0 1px; border-radius: 3px; }
  tr.context { background: #141821; }
  tr.context td { color: var(--muted); }
  tr.context td.cat { color: #7f8b9e; }
  .session-match { color: var(--muted); font-size: 11px; margin-top: 4px; }
  tr.error td.msg { color: #ffc2c2; }
  tr.warn td.msg { color: #ffe2a3; }
  .fields { margin-top: 4px; }
  .fields summary { color: var(--muted); cursor: pointer; font-size: 11px; }
  .fields pre { margin: 6px 0 0; padding: 8px; background: #0d1015;
                border: 1px solid var(--border); border-radius: 6px;
                white-space: pre-wrap; font-size: 11px; color: #c7d2e4; }
  .load { margin: 12px 0; padding: 8px 16px; border-radius: 8px;
          border: 1px solid var(--border); background: var(--panel-2);
          color: var(--text); cursor: pointer; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: minmax(64px, 18%) minmax(0, 1fr); }
    header { padding: 8px 12px; }
    header .meta { max-height: 3em; overflow: auto; }
    main { padding: 8px; }
    .cards { grid-template-columns: repeat(5, minmax(125px, 1fr)); overflow-x: auto; }
    input[type="search"] { min-width: 0; width: 100%; }
    aside { min-height: 0; overflow: auto; overscroll-behavior: contain; border-right: 0; border-bottom: 1px solid var(--border);
            max-height: 220px; overflow: auto; }
    td.cat { width: 120px; }
    td.time { width: 110px; }
  }
</style>
</head>
<body>
<header>
  <h1>ReplyKit 診斷檢視器</h1>
  <div class="meta" id="fileMeta">載入中…</div>
</header>
<div class="layout">
  <aside>
    <h2>分類</h2>
    <div id="categories"></div>
  </aside>
  <main>
    <div class="controls">
    <div class="cards" id="cards"></div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜尋訊息、session、數值…" autocomplete="off">
      <select id="severity" title="嚴重度">
        <option value="">全部嚴重度</option>
        <option value="error">錯誤</option>
        <option value="warn">警告</option>
        <option value="info">一般</option>
      </select>
      <select id="session" title="Session"><option value="">全部 Session</option></select>
      <select id="range" title="時間範圍；最近 N 以檔案最新紀錄為準">
        <option value="all">全部時間</option>
        <option value="15">最近 15 分鐘</option>
        <option value="60">最近 1 小時</option>
        <option value="360">最近 6 小時</option>
        <option value="1440">最近 24 小時</option>
        <option value="custom">自訂區間…</option>
      </select>
      <span class="range" id="customRange" hidden>
        <input id="from" type="datetime-local" aria-label="開始時間">
        <span>～</span>
        <input id="to" type="datetime-local" aria-label="結束時間">
      </span>
      <select id="order" title="時間排序">
        <option value="asc">時間：舊→新</option>
        <option value="desc">時間：新→舊</option>
      </select>
      <select id="context" title="鄰近筆數">
        <option value="0">不顯示鄰近</option>
        <option value="2">前後 2 筆</option>
        <option value="5">前後 5 筆</option>
        <option value="10">前後 10 筆</option>
      </select>
      <button class="pill active" id="reset" type="button">清除篩選</button>
    </div>
    </div>
    <div class="status" id="status" role="status"></div>
    <section class="log-scroll" id="logScroll" tabindex="0" aria-label="診斷日誌">
    <table>
      <thead><tr><th>時間</th><th>分類</th><th>內容</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>沒有符合條件的紀錄。</div>
    <button class="load" id="more" type="button" hidden>載入更多</button>
    </section>
  </main>
</div>
<script>
const state = { category: "", q: "", severity: "", session: "", context: 0, order: "asc", range: "all", from: 0, to: 0, latest: 0, offset: 0, limit: 300, total: 0 };
const $ = (id) => document.getElementById(id);
let searchTimer = 0;

function formatTime(ms) {
  if (!ms) return "—";
  return new Date(ms).toLocaleString("zh-TW", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  });
}

function rangeLabel() {
  if (state.from && state.to) return `${formatTime(state.from)} ～ ${formatTime(state.to)}`;
  if (state.from) return `${formatTime(state.from)} 之後`;
  if (state.to) return `${formatTime(state.to)} 之前`;
  return "全部時間";
}

function text(tag, value) {
  const el = document.createElement(tag);
  el.textContent = value == null ? "" : String(value);
  return el;
}

// 只用 DOM text node 建立 mark，不把日誌內容塞進 innerHTML。
function appendHighlighted(parent, value, query) {
  const source = value == null ? "" : String(value);
  if (!query) {
    parent.appendChild(document.createTextNode(source));
    return;
  }
  const lower = source.toLocaleLowerCase();
  const needle = query.toLocaleLowerCase();
  let start = 0;
  let index = lower.indexOf(needle, start);
  if (index < 0) {
    parent.appendChild(document.createTextNode(source));
    return;
  }
  while (index >= 0) {
    if (index > start) {
      parent.appendChild(document.createTextNode(source.slice(start, index)));
    }
    const mark = document.createElement("mark");
    mark.textContent = source.slice(index, index + needle.length);
    parent.appendChild(mark);
    start = index + needle.length;
    index = lower.indexOf(needle, start);
  }
  if (start < source.length) {
    parent.appendChild(document.createTextNode(source.slice(start)));
  }
}

function card(label, value, color) {
  const box = document.createElement("div");
  box.className = "card";
  box.appendChild(text("div", label)).className = "label";
  const val = text("div", value);
  val.className = "value";
  if (color) val.style.color = color;
  box.appendChild(val);
  return box;
}

function renderSummary(s) {
  state.latest = Number(s.latest) || 0;
  $("fileMeta").textContent = `${s.file} · ${s.range} · ${s.lines} 行`;
  const cards = $("cards");
  cards.replaceChildren(
    card("總行數", s.lines),
    card("時間範圍", s.range),
    card("Session", s.sessions.length),
    card("警告", s.warn, "var(--warn)"),
    card("錯誤", s.error, "var(--error)")
  );
  const categories = $("categories");
  categories.replaceChildren();
  const all = document.createElement("button");
  all.className = "cat" + (state.category === "" ? " active" : "");
  all.dataset.category = "";
  all.appendChild(text("span", "全部"));
  all.appendChild(text("span", String(s.lines))).className = "count";
  all.onclick = () => { state.category = ""; state.offset = 0; load(); };
  categories.appendChild(all);
  for (const item of s.categories) {
    const button = document.createElement("button");
    button.className = "cat" + (state.category === item.name ? " active" : "");
    button.dataset.category = item.name;
    button.appendChild(text("span", item.name));
    const count = text("span", item.count);
    count.className = "count";
    button.appendChild(count);
    button.onclick = () => { state.category = item.name; state.offset = 0; load(); };
    categories.appendChild(button);
  }
  const session = $("session");
  const current = state.session;
  session.replaceChildren(new Option("全部 Session", ""));
  for (const id of s.sessions) session.appendChild(new Option(id, id));
  session.value = current;
}

function syncActiveCategory() {
  for (const button of document.querySelectorAll(".cat")) {
    button.classList.toggle("active", (button.dataset.category || "") === state.category);
  }
}

function renderRows(data, append) {
  const body = $("rows");
  if (!append) body.replaceChildren();
  for (const line of data.lines) {
    const existing = body.querySelector(`tr[data-n="${line.n}"]`);
    if (existing) {
      // 下一頁的 context 可能先出現過；真正符合篩選時把它升級成 highlight row。
      if (line.isMatch) existing.classList.remove("context");
      continue;
    }
    const tr = document.createElement("tr");
    tr.dataset.n = String(line.n);
    tr.className = line.severity + (line.isMatch === false ? " context" : "");
    const time = text("td", line.time);
    time.className = "time";
    const cat = document.createElement("td");
    cat.className = "cat";
    appendHighlighted(cat, line.category, state.q);
    const msg = document.createElement("td");
    msg.className = "msg";
    const message = document.createElement("div");
    appendHighlighted(message, line.message, state.q);
    msg.appendChild(message);
    const fields = Object.entries(line.fields || {});
    const query = state.q.toLocaleLowerCase();
    const messageMatch = query && line.message.toLocaleLowerCase().includes(query);
    const categoryMatch = query && line.category.toLocaleLowerCase().includes(query);
    const sessionMatch = query && line.session
      && line.session.toLocaleLowerCase().includes(query);
    const fieldMatch = query && fields.some(([key, value]) =>
      `${key}=${value}`.toLocaleLowerCase().includes(query));
    const sessionOnly = sessionMatch && !messageMatch && !categoryMatch && !fieldMatch;
    if (sessionOnly) {
      // session 也是後端搜尋範圍；沒有其他可見命中時把它顯示出來，
      // 避免出現「有結果但看不到哪個字被對上」。
      fields.unshift(["session", line.session]);
    }
    if (fields.length) {
      const details = document.createElement("details");
      details.className = "fields";
      // 訊息本身已高亮時不自動展開；只有欄位或 session 單獨命中才展開。
      details.open = Boolean(fieldMatch || sessionOnly) && !messageMatch;
      details.appendChild(text("summary", `${fields.length} 個欄位`));
      const pre = document.createElement("pre");
      fields.forEach(([key, value], index) => {
        if (index > 0) pre.appendChild(document.createTextNode("\n"));
        appendHighlighted(pre, `${key} = ${value}`, state.q);
      });
      details.appendChild(pre);
      msg.appendChild(details);
    }
    tr.append(time, cat, msg);
    body.appendChild(tr);
  }
  $("empty").hidden = data.lines.length !== 0;
  $("more").hidden = !data.hasMore;
  $("more").textContent = `載入更多（目前 ${data.offset + data.matchCount} / ${data.total}）`;
  syncActiveCategory();
}

async function load(append = false) {
  if (!append) {
    state.offset = 0;
    $("logScroll").scrollTop = 0;
    $("status").textContent = "載入中…";
  }
  const params = new URLSearchParams({
    category: state.category, q: state.q, severity: state.severity,
    session: state.session, context: String(state.context),
    order: state.order, from: String(state.from), to: String(state.to),
    offset: String(state.offset), limit: String(state.limit)
  });
  const response = await fetch("/api/lines?" + params);
  if (!response.ok) {
    $("status").textContent = "讀取失敗：" + response.status;
    return;
  }
  const data = await response.json();
  state.total = data.total;
  renderRows(data, append);
  const contextNote = state.context ? ` · 含前後 ${state.context} 列` : "";
  const orderNote = state.order === "desc" ? "新→舊" : "舊→新";
  const anchorNote = state.range !== "all" && state.range !== "custom" && state.latest
    ? `（以最新紀錄 ${formatTime(state.latest)} 為準）` : "";
  $("status").textContent = `${data.total} 筆符合 · 顯示 ${data.offset + data.matchCount} 筆${contextNote} · 目前 ${$("rows").children.length} 列`
    + (state.category ? ` · 分類 ${state.category}` : "")
    + ` · 時間 ${rangeLabel()}${anchorNote} · 排序 ${orderNote}`;
  if (data.hasMore) state.offset = data.offset + data.matchCount;
}

function scheduleSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.q = $("search").value.trim(); load(); }, 220);
}

function applyCustomRange() {
  const from = $("from").value ? new Date($("from").value).getTime() : 0;
  const to = $("to").value ? new Date($("to").value).getTime() : 0;
  state.from = Number.isFinite(from) ? from : 0;
  state.to = Number.isFinite(to) ? to : 0;
  load();
}

$("search").addEventListener("input", scheduleSearch);
$("severity").addEventListener("change", () => { state.severity = $("severity").value; load(); });
$("session").addEventListener("change", () => { state.session = $("session").value; load(); });
$("context").addEventListener("change", () => { state.context = Number($("context").value) || 0; load(); });
$("order").addEventListener("change", () => { state.order = $("order").value; load(); });
$("range").addEventListener("change", () => {
  const value = $("range").value;
  state.range = value;
  $("customRange").hidden = value !== "custom";
  if (value === "custom") {
    applyCustomRange();
    return;
  }
  state.from = value === "all" ? 0 : (state.latest || Date.now()) - Number(value) * 60000;
  state.to = 0;
  load();
});
$("from").addEventListener("change", applyCustomRange);
$("to").addEventListener("change", applyCustomRange);
$("more").addEventListener("click", () => load(true));
$("reset").addEventListener("click", () => {
  state.category = ""; state.q = ""; state.severity = ""; state.session = ""; state.context = 0;
  state.order = "asc"; state.range = "all"; state.from = 0; state.to = 0; state.offset = 0;
  $("search").value = ""; $("severity").value = ""; $("session").value = ""; $("context").value = "0";
  $("order").value = "asc"; $("range").value = "all";
  $("customRange").hidden = true; $("from").value = ""; $("to").value = "";
  load();
});

(async function boot() {
  const response = await fetch("/api/summary");
  if (!response.ok) {
    $("fileMeta").textContent = "讀取失敗：" + response.status;
    return;
  }
  const summary = await response.json();
  renderSummary(summary);
  await load();
})();
</script>
</body>
</html>
