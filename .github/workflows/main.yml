name: iOS Archive & Release via Tag

on:
  workflow_run:
    workflows: ["Check Changes & Trigger Tag"]
    types:
      - completed

# workflow_run 的 github.ref 不代表來源分支，必須使用上游 head_branch。
# 失敗／取消的上游只產生略過工作，不得取消正在執行的正常發布。
# 進行中的 archive 不取消；新觸發排隊，GitHub 只會取代較舊的 pending，
# 避免接近完成的建置因下一次 push 白費 20 多分鐘。
concurrency:
  group: archive-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  unit-tests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.workflow_run.head_sha }}

  build:
    needs: unit-tests
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      BUILD_INFO_PACKAGES_DIR: /tmp/liveapp-source-packages
      FASTLANE_USER: ${{ secrets.APPID }}
      FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPPass }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify Xcode 27 and iOS SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          echo "Developer directory: $DEVELOPER_DIR" >> "$GITHUB_STEP_SUMMARY"
          for SDK in iphoneos iphonesimulator; do
            SDK_VERSION=$(xcrun --sdk "$SDK" --show-sdk-version)
            echo "$SDK SDK: $SDK_VERSION" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$SDK_VERSION" != 27.* ]]; then
              echo "::error::需要 iOS 27.x SDK，實際 $SDK 為 $SDK_VERSION；停止以免略過 ScreenCaptureKit 分支。"
              exit 1
            fi
          done

      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          # Xcode 26 起 Metal 編譯器（metalToolchain）改為需另外下載的元件，
          # 缺少它會使 .metal 編譯失敗（rotateNV12.metal）。安裝到本機 Xcode。
          xcodebuild -downloadComponent metalToolchain

      - name: Get tag
        id: get_tag
        run: |
          TAG=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$TAG" ]; then
            TAG=$(git tag --list "[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "❌ No tag found"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Resolve release versions 對齊 tag
        id: marketing_version
        run: |
          set -euo pipefail
          OLD_VERSIONS=$(grep -Eo 'MARKETING_VERSION = [^;]+;' liveAPP.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([^;]+);/\1/' \
            | grep -v '^1\.0$' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' || true)
          OLD_BUILDS=$(grep -Eo 'CURRENT_PROJECT_VERSION = [^;]+;' liveAPP.xcodeproj/project.pbxproj \
            | sed -E 's/.*= ([^;]+);/\1/' \
            | sort -u \
            | tr '\n' ',' \
            | sed 's/,$//' || true)
          # 每次 release 使用單調的 UTC 時間建號；同時覆寫 Info.plist 的 CFBundleVersion。
          BUILD_VERSION=$(date -u +%Y%m%d%H%M%S)
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          echo "old=$OLD_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "new=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_old=$OLD_BUILDS" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "MARKETING_VERSION old=$OLD_VERSIONS -> effective=$TAG"
            echo "CURRENT_PROJECT_VERSION old=$OLD_BUILDS -> effective=$BUILD_VERSION"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$OLD_VERSIONS" != "$TAG" ]; then
            echo "::notice::CI 以 xcodebuild 覆寫 MARKETING_VERSION：$OLD_VERSIONS -> $TAG（不修改 repo 檔案）"
          fi

      # 使用主 App scheme，避免誤選 ReplyKITSetupUI 等擴展。
      - name: Set application scheme
        id: scheme
        run: echo "scheme=liveAPP" >> "$GITHUB_OUTPUT"

      - name: Filetype Parameter 檔案類型參數設定
        id: filetype_parameter
        run: |
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then
              echo "file_to_build=$(ls -A | grep -i \\.xcworkspace\$)" >> $GITHUB_OUTPUT
              echo "filetype_parameter=workspace" >> $GITHUB_OUTPUT
          else
              echo "file_to_build=$(ls -A | grep -i \\.xcodeproj\$)" >> $GITHUB_OUTPUT
              echo "filetype_parameter=project" >> $GITHUB_OUTPUT
          fi
      

      # 2️⃣ Clean caches
      # - name: Clean DerivedData and SwiftPM cache
      #   run: |
      #     rm -rf ~/Library/Developer/Xcode/DerivedData/*
      #     rm -rf ~/Library/Caches/org.swift.swiftpm/*
      #     rm -rf .build

      # 2️⃣.5 Force resolve dependencies to locked revision
      - name: Resolve SwiftPM dependencies
        run: |
          echo "Resolving Swift Package Manager dependencies to locked revisions"
          xcodebuild -clonedSourcePackagesDirPath "$BUILD_INFO_PACKAGES_DIR" -resolvePackageDependencies -project liveAPP.xcodeproj -scheme liveAPP \
            -onlyUsePackageVersionsFromResolvedFile
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}

      - name: Fast compile 編譯檢查
        id: fast_build
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.filetype_parameter.outputs.file_to_build }}
        continue-on-error: true
        run: |
          echo "Running a fast build on iOS Simulator to surface compile errors quickly"
          set +e
          xcodebuild -skipPackagePluginValidation -skipMacroValidation \
            -clonedSourcePackagesDirPath "$BUILD_INFO_PACKAGES_DIR" -scheme "$scheme" -"$filetype_parameter" "$file_to_build" \
            -sdk iphonesimulator -configuration Debug \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            clean build CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log | xcpretty --no-utf --no-color
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "Fast build exit code: $EXIT_CODE"

          # 將 exit code 輸出到 GitHub Actions
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          # 如果失敗，顯示警告並以非零 exit code 退出
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::warning::Fast build failed with exit code $EXIT_CODE"
            echo "--- Raw xcodebuild output (last 100 lines) ---"
            tail -100 xcodebuild.log 2>/dev/null || echo "(log file not found)"
            exit $EXIT_CODE
          else
            echo "::notice::Fast build succeeded"
          fi

      - name: Summarize fast-build log 彙整編譯錯誤與警告
        if: always()
        run: |
          set -o pipefail
          python3 Scripts/ci_test_summary.py xcodebuild.log \
            --markdown xcodebuild-summary.md \
            --github-summary

      - name: Upload full xcodebuild.log
        if: steps.fast_build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-full-log
          path: xcodebuild.log

      - name: Upload xcodebuild errors/warnings summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-errors-warnings
          path: xcodebuild-summary.md
          if-no-files-found: warn


      # 3️⃣ Build & Archive (Unsigned)
      - name: Build & Archive Unsigned IPA 構建與打包未簽名的 IPA
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.filetype_parameter.outputs.file_to_build }}
          MARKETING_VERSION: ${{ steps.marketing_version.outputs.new }}
          CURRENT_PROJECT_VERSION: ${{ steps.marketing_version.outputs.build }}

        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild -skipPackagePluginValidation -skipMacroValidation \
            -clonedSourcePackagesDirPath "$BUILD_INFO_PACKAGES_DIR" clean -$filetype_parameter "$file_to_build" -scheme "$scheme" -configuration Release \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee build/archive.log

          xcodebuild -skipPackagePluginValidation -skipMacroValidation \
            -clonedSourcePackagesDirPath "$BUILD_INFO_PACKAGES_DIR" archive \
            -$filetype_parameter "$file_to_build" \
            -scheme "$scheme" \
            -configuration Release \
            -archivePath $PWD/build/liveApp.xcarchive \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            SWIFT_SYMBOL_REDACTION=NO 2>&1 | tee -a build/archive.log

            
      - name: Summarize archive log 彙整封存錯誤與警告
        if: always()
        run: |
          set -o pipefail
          python3 Scripts/ci_test_summary.py build/archive.log \
            --markdown build/archive-summary.md \
            --github-summary

      - name: Upload archive log & summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archive-log
          path: |
            build/archive.log
            build/archive-summary.md
          if-no-files-found: warn

      - name: Add KSign-compatible alternate icon files 補 KSign 相容圖示
        run: bash Scripts/add_legacy_alternate_icons.sh "build/liveApp.xcarchive/Products/Applications/liveAPP.app"

      - name: Verify archived app icons 檢查封存圖示宣告
        run: |
          python3 -m unittest discover -s Scripts -p test_inspect_app_bundle.py
          python3 Scripts/inspect_app_bundle.py "build/liveApp.xcarchive/Products/Applications/liveAPP.app" --output build/app-bundle-report.md --github-summary --expect-excluded Scripts/package_exclusions.txt

      - name: Upload app bundle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-bundle-report
          path: |
            build/app-bundle-report.md
            build/app-bundle-report.json
          if-no-files-found: warn

      - name: Read app version 讀取 App 版本
        id: app_version
        run: |
          set -euo pipefail
          PLIST="build/liveApp.xcarchive/Products/Applications/liveAPP.app/Info.plist"
          SHORT=$(plutil -extract CFBundleShortVersionString raw "$PLIST")
          BUILD=$(plutil -extract CFBundleVersion raw "$PLIST")
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Archived app version: CFBundleShortVersionString=$SHORT CFBundleVersion=$BUILD" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$SHORT" != "$TAG" ]; then
            echo "::error::MARKETING_VERSION override 未生效：archive=$SHORT tag=$TAG"
            exit 1
          fi
          if [ "$BUILD" != "$BUILD_VERSION" ]; then
            echo "::error::CURRENT_PROJECT_VERSION override 未生效：archive=$BUILD expected=$BUILD_VERSION"
            exit 1
          fi

      - name: Classify release 產生 Release 分類
        id: release_meta
        run: |
          python3 Scripts/classify_release.py \
            --tag "$TAG" \
            --config Scripts/release_classification.json \
            --exp-window 5 > build/release-metadata.json
          NAME=$(jq -r '.name' build/release-metadata.json)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cat build/release-metadata.json

      # 4️⃣ Extract symbols for crash symbolication
      - name: Extract symbol map 提取符號表
        run: |
          ARCHIVE="build/liveApp.xcarchive"
          APPEX="$ARCHIVE/Products/Applications/liveAPP.app/PlugIns/ReplyKIT.appex/ReplyKIT"
          DSYM="$ARCHIVE/dSYMs/ReplyKIT.appex.dSYM/Contents/Resources/DWARF/ReplyKIT"

          if [ -f "$APPEX" ]; then
            echo "=== Binary info ==="
            file "$APPEX"
            echo ""
            echo "=== Full symbol map (stripped binary) ==="
            nm -n "$APPEX" > build/symbol_map.txt 2>&1
            echo "Symbol map size: $(wc -l < build/symbol_map.txt) lines"
          else
            echo "⚠️ Appex binary not found at $APPEX"
          fi

          if [ -f "$DSYM" ]; then
            echo "=== dSYM UUID ==="
            dwarfdump --uuid "$DSYM" 2>&1 || true
            echo ""
            echo "=== Non-stripped symbol map (dSYM) ==="
            nm -n "$DSYM" > build/symbols_text.txt 2>&1
            echo "dSYM symbol map size: $(wc -l < build/symbols_text.txt) lines"
          else
            echo "⚠️ dSYM not found at $DSYM"
          fi

      - name: Upload symbol map 上傳符號表
        uses: actions/upload-artifact@v7
        with:
          name: crash-symbols
          path: |
            build/symbol_map.txt
            build/symbols_text.txt
            build/liveApp.xcarchive/dSYMs/

      # 5️⃣ Export Unsigned IPA using external plist
      - name: Export Unsigned IPA 打包未簽名的 IPA
        run: |
        
          cd build
          cp -r liveApp.xcarchive/Products/Applications/*.app .
          mkdir -p Payload
          mv *.app Payload/

          
          TAG=${TAG}

          zip -r liveApp_${TAG}.ipa Payload

          mv liveApp.xcarchive liveApp_${TAG}.xcarchive

          zip -r liveApp_${TAG}.xcarchive.zip liveApp_${TAG}.xcarchive
          cd ..

          echo "Listing build directory contents"
          ls -al build/

      - name: Inspect IPA contents 分析最終 IPA 包體
        run: |
          python3 Scripts/inspect_app_bundle.py "build/liveApp_${TAG}.ipa" --output build/ipa-size-report.md --github-summary --expect-excluded Scripts/package_exclusions.txt

      - name: Upload IPA size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipa-size-report
          path: |
            build/ipa-size-report.md
            build/ipa-size-report.json
          if-no-files-found: warn

      - name: Read IPA metadata 讀取 IPA 大小
        id: ipa_meta
        run: echo "size=$(stat -f%z "build/liveApp_${TAG}.ipa")" >> "$GITHUB_OUTPUT"

      - name: Prepare AltStore notes 準備更新說明
        run: |
          mkdir -p build
          {
            echo "此版本更新："
            git log -n 10 --pretty=format:"- %s"
          } > build/altstore-notes.txt

      - name: Compose AltStore source 產生 AltStore 來源
        run: |
          python3 Scripts/update_altstore_source.py \
            --path AltStoreTest.json \
            --output build/AltStoreTest.json \
            --tag "$TAG" \
            --version "${{ steps.app_version.outputs.short }}" \
            --build "${{ steps.app_version.outputs.build }}" \
            --size "$(stat -f%z "build/liveApp_${TAG}.ipa")" \
            --repo "${{ github.repository }}" \
            --notes-file build/altstore-notes.txt

      - name: Upload Release with merged body 上傳 Release 並合併內容
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_tag.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_meta.outputs.name }}
        run: |
          GITHUB_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          
          # 抓取最近 10 次 commit 訊息
          COMMITS=$(git log -n 10 --pretty=format:"- %s (%h)" | sed 's/@unknown/`@unknown`/g')
          CLASSIFICATION=$(jq -r '.summary' build/release-metadata.json)


          NEW_MESSAGE="${RELEASE_NAME}

          $CLASSIFICATION

          Automated unsigned iOS build ${TAG_NAME}
          Updated at $(TZ=Asia/Taipei LANG=zh_TW.UTF-8 date +"%Y/%m/%d %p %H:%M:%S (%A)")
          
          Recent commits:
          
          $COMMITS"

          # 嘗試取得現有 release
          RELEASE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          $GITHUB_API/tags/$TAG_NAME)

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id // empty')

          if [ -n "$RELEASE_ID" ]; then
           # Release 存在 → 合併 body
          
           EXISTING_BODY=$(echo "$RELEASE" | jq -r '.body')
           
           MERGED_BODY="$EXISTING_BODY
           
           $NEW_MESSAGE"
           

           PAYLOAD=$(jq -n \
              --arg name "$RELEASE_NAME" \
              --arg body "$MERGED_BODY" \
              '{name: $name, body: $body}')
              
           # 更新 Release
           curl -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            $GITHUB_API/$RELEASE_ID \
           -d "$PAYLOAD"

          else
           # Release 不存在 → 建立 Release

           PAYLOAD=$(jq -n \
                --arg tag "$TAG_NAME" \
                --arg name "$RELEASE_NAME" \
                --arg body "$NEW_MESSAGE" \
                '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')


           NEW_BODY=$(echo "$NEW_MESSAGE" | jq -Rs --slurp '.')
          
           curl -X POST \
           -H "Authorization: token $GITHUB_TOKEN" \
           -H "Accept: application/vnd.github.v3+json" \
           $GITHUB_API \
           -d "$PAYLOAD"
          fi


        
      # 6️⃣ Upload IPA & Archive to Release
      - name: Upload Release 上傳 Release
        uses: softprops/action-gh-release@v3
        with:

          # 已略過上傳 build/liveApp_${{ steps.get_tag.outputs.tag }}.xcarchive.zip

          tag_name: ${{ steps.get_tag.outputs.tag }}
          overwrite_files: true
          files: |
            build/*.ipa
            build/AltStoreTest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
