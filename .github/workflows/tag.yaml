name: Check Changes & Trigger Tag

on:
  push:
    paths:
      - "liveAPP/**"
      - "ReplyKIT/**"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch origin --tags

      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git tag --list "[0-9]*" | sort -V | tail -n1)
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "Latest tag: $latest_tag"

      - name: Compare changes in monitored paths
        id: diff
        run: |
          LATEST="${{ steps.get_tag.outputs.latest_tag }}"
          if [ -z "$LATEST" ]; then
            echo "No existing tag found, will create v0.0.1"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$LATEST" HEAD -- liveAPP/ ReplyKIT/ || true)
          echo "changed_files=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "No relevant changes detected. Exiting..."
            exit 0
          fi
          echo "Changes detected in relevant paths"

      - name: Create new tag
        run: |
          latest_tag="${{ steps.get_tag.outputs.latest_tag }}"
          if [ -z "$latest_tag" ]; then
            NEW_TAG="0.0.1"
          else
            IFS='.' read -r major minor patch <<< "${latest_tag}"
            while true; do
              patch=$((patch + 1))
              if [ "$patch" -gt 9 ]; then
                patch=0
                minor=$((minor + 1))
              fi
              if [ "$minor" -gt 9 ]; then
                minor=0
                major=$((major + 1))
              fi
              NEW_TAG="$major.$minor.$patch"
              if ! git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
                break
              fi
              echo "Tag $NEW_TAG already exists, trying next..."
            done
          fi

          echo "New tag: $NEW_TAG"

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
