name: Development index
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Validate feature links and index behavior
        run: python3 Scripts/test_dev_index.py
