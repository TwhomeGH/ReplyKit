name: Development index
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
# 同一分支／PR 的新檢查取代舊檢查，不影響其他分支。
concurrency:
  group: development-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 50
      - name: Validate feature links and index behavior
        run: python3 Scripts/test_dev_index.py
      - name: Check Markdown structure (MD001/MD012)
        run: python3 Scripts/check_markdown.py
