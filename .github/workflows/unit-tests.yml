name: iOS Unit Tests

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 要測試的 commit；發布流程傳入相同 head SHA
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tests:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      BUILD_INFO_PACKAGES_DIR: /tmp/liveapp-source-packages
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Test build information generator
        run: python3 Scripts/test_build_info.py

      - name: Verify Xcode 27 and iOS SDKs
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          echo "Developer directory: $DEVELOPER_DIR" >> "$GITHUB_STEP_SUMMARY"
          for SDK in iphoneos iphonesimulator; do
            SDK_VERSION=$(xcrun --sdk "$SDK" --show-sdk-version)
            echo "$SDK SDK: $SDK_VERSION" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$SDK_VERSION" != 27.* ]]; then
              echo "::error::需要 iOS 27.x SDK，實際 $SDK 為 $SDK_VERSION；停止以免略過 ScreenCaptureKit 分支。"
              exit 1
            fi
          done

      - name: Install Metal Toolchain
        run: |
          set -euo pipefail
          # Xcode 26 起 Metal 編譯器（metalToolchain）改為需另外下載的元件，
          # 缺少它會使 .metal 編譯失敗（rotateNV12.metal）。安裝到本機 Xcode。
          xcodebuild -downloadComponent metalToolchain

      - name: Select available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/test-devices.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "test-devices.json").read_text())
          candidates = []
          for runtime, devices in data["devices"].items():
              match = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)(?:-(\d+))?$", runtime)
              if not match:
                  continue
              version = tuple(int(value or 0) for value in match.groups())
              if version[0] != 27:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device.get("state") == "Booted", device["name"], device["udid"]))
          if not candidates:
              raise SystemExit("No available iOS 27 iPhone simulator; tests cannot run.")
          version, booted, name, udid = max(candidates)
          print(f"Using {name}, iOS {version}, {udid}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"id={udid}\nbooted={str(booted).lower()}\n")
          PY

      - name: Boot simulator
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
          ALREADY_BOOTED: ${{ steps.simulator.outputs.booted }}
        run: |
          if [ "$ALREADY_BOOTED" != "true" ]; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Resolve locked package versions
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild -clonedSourcePackagesDirPath "$BUILD_INFO_PACKAGES_DIR" -resolvePackageDependencies \
            -project liveAPP.xcodeproj -scheme liveAPP \
            -onlyUsePackageVersionsFromResolvedFile 2>&1 | tee TestResults/resolve.log

      - name: Run liveAPP unit tests
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild -clonedSourcePackagesDirPath "$BUILD_INFO_PACKAGES_DIR" test \
            -project liveAPP.xcodeproj -scheme liveAPP \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -destination-timeout 120 \
            -only-testing:liveAPPTests \
            -parallel-testing-enabled NO \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -resultBundlePath TestResults/liveAPPTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee TestResults/tests.log

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: liveAPP-unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
