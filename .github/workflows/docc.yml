name: DocC Documentation

# 在 macOS runner 產生 Apple DocC 文件（Windows 無法，見 Docs/development/README.md）。
# 產出 .doccarchive → 轉為可靜態託管的站台，上傳 artifact 並部署到 GitHub Pages。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'liveAPP/Documentation.docc/**'
      - 'liveAPP/**/*.swift'
      - 'SharedCapture/**/*.swift'
      - '.github/workflows/docc.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docc
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Xcode 27 and install Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          # Xcode 26 起 Metal 編譯器改為需另外下載；缺它會使 .metal 編譯失敗。
          xcodebuild -downloadComponent metalToolchain

      - name: Build DocC archive
        run: |
          set -euo pipefail
          xcodebuild docbuild \
            -scheme liveAPP \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
          ARCHIVE=$(find build -name '*.doccarchive' | head -1)
          echo "DocC archive: $ARCHIVE"
          test -n "$ARCHIVE"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Transform for static hosting
        run: |
          set -euo pipefail
          rm -rf site
          xcrun docc process-archive transform-for-static-hosting "$ARCHIVE" \
            --output-path site --hosting-base-path ReplyKit
          touch site/.nojekyll

          # 找出實際模組目錄（優先 liveapp），DocC 不會自動給根目錄轉址。
          MODULE=""
          for candidate in liveapp liveAPP; do
            if [ -d "site/documentation/$candidate" ]; then MODULE="$candidate"; break; fi
          done
          if [ -z "$MODULE" ]; then
            MODULE=$(find site/documentation -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1 | xargs -r basename)
          fi
          echo "DocC module: ${MODULE:-<none>}"

          if [ -n "$MODULE" ]; then
            printf '<meta http-equiv="refresh" content="0; url=./documentation/%s/">' "$MODULE" > site/index.html
          fi

          {
            echo "### DocC 站台結構"
            echo "- App URL: ${{ github.server_url }}/${{ github.repository }} → Pages: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY##*/}/"
            echo "- module: ${MODULE:-<none>}"
            echo "- site/documentation: $( (cd site/documentation 2>/dev/null && ls) | tr '\n' ' ' )"
            echo '```'
            (cd site && find . -maxdepth 2 -type d | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package DocC site (zip for download)
        run: |
          set -euo pipefail
          # DocC 會產生含 ':' 的符號檔名（如 makebounds(_:).json），
          # actions/upload-artifact 不接受此類路徑；打包成單一 zip 上傳即可。
          # GitHub Pages 那條用 tar，內含檔名不受影響。
          rm -f docc-site.zip
          (cd site && zip -qr ../docc-site.zip .)

      - name: Upload DocC site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docc-site
          path: docc-site.zip
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
