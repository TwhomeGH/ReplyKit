name: DocC documentation

# 在 macOS runner 產生 Apple DocC、保存 doccarchive／revision／日誌，並部署到 GitHub Pages。
# Windows 無 Apple SDK 無法產生 DocC，詳見 Docs/development/README.md。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'liveAPP/Documentation.docc/**'
      - 'liveAPP/**/*.swift'
      - 'SharedCapture/**/*.swift'
      - 'liveAPP.xcodeproj/**'
      - 'Package.resolved'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docc
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Metal toolchain
        run: |
          set -euo pipefail
          # Xcode 26 起 Metal 編譯器改為需另外下載；缺它會使 .metal 編譯失敗。
          xcodebuild -downloadComponent metalToolchain

      - name: Build App documentation
        run: |
          set -euo pipefail
          mkdir -p DocumentationArtifacts
          git rev-parse HEAD > DocumentationArtifacts/app-revision.txt
          cp Package.resolved DocumentationArtifacts/Package.resolved
          xcodebuild -skipPackagePluginValidation -skipMacroValidation docbuild \
            -project liveAPP.xcodeproj -scheme liveAPP \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/replykit-docc \
            -clonedSourcePackagesDirPath /tmp/replykit-docc-packages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee DocumentationArtifacts/docbuild.log
          ARCHIVE=$(find /tmp/replykit-docc -name '*.doccarchive' -type d -print -quit)
          test -n "$ARCHIVE"
          cp -R "$ARCHIVE" DocumentationArtifacts/
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          {
            echo "### docbuild 摘要（診斷 App 模組是否被建置）"
            echo '```'
            grep -Ei "docbuild|catalog|symbol graph|error:|warning:|liveAPP|livedoc" DocumentationArtifacts/docbuild.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Transform for static hosting
        run: |
          set -euo pipefail
          rm -rf site
          xcrun docc process-archive transform-for-static-hosting "$ARCHIVE" \
            --output-path site --hosting-base-path ReplyKit
          touch site/.nojekyll

          # 找出實際模組目錄（優先 liveapp），DocC 不會自動產生根目錄轉址。
          MODULE=""
          for candidate in liveapp liveAPP; do
            if [ -d "site/documentation/$candidate" ]; then MODULE="$candidate"; break; fi
          done
          if [ -z "$MODULE" ]; then
            MODULE=$(find site/documentation -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1 | xargs -r basename)
          fi
          echo "DocC module: ${MODULE:-<none>}"
          if [ -n "$MODULE" ]; then
            printf '<meta http-equiv="refresh" content="0; url=./documentation/%s/">' "$MODULE" > site/index.html
          fi

          {
            echo "### DocC 站台結構"
            OWNER=$(printf '%s' "${GITHUB_REPOSITORY_OWNER:-owner}" | tr '[:upper:]' '[:lower:]')
            REPO="${GITHUB_REPOSITORY#*/}"
            echo "- Pages 根網址：https://${OWNER}.github.io/${REPO}/"
            echo "- module: ${MODULE:-<none>}"
            echo "- site/documentation: $( (cd site/documentation 2>/dev/null && ls) | tr '\n' ' ' )"
            echo "- site/data/documentation: $( (cd site/data/documentation 2>/dev/null && ls) | tr '\n' ' ' )"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package documentation artifact (zip)
        if: always()
        run: |
          set -euo pipefail
          # doccarchive 內含 ':' 檔名（如 makebounds(_:).json），upload-artifact 不接受，
          # 故整包壓成單一 zip 上傳。
          if [ -d DocumentationArtifacts ]; then
            (cd DocumentationArtifacts && zip -qr "../documentation-${GITHUB_SHA}.zip" .)
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-${{ github.sha }}
          path: documentation-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
