name: DocC documentation

# 在 macOS runner 產生 Apple DocC、保存 doccarchive／revision／日誌，並部署到 GitHub Pages。
# Windows 無 Apple SDK 無法產生 DocC，詳見 Docs/development/README.md。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'liveAPP/Documentation.docc/**'
      - 'liveAPP/**/*.swift'
      - 'SharedCapture/**/*.swift'
      - 'liveAPP.xcodeproj/**'
      - 'Package.resolved'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docc
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Metal toolchain
        run: |
          set -euo pipefail
          # Xcode 26 起 Metal 編譯器改為需另外下載；缺它會使 .metal 編譯失敗。
          xcodebuild -downloadComponent metalToolchain

      - name: Build App documentation
        run: |
          set -euo pipefail
          mkdir -p DocumentationArtifacts
          git rev-parse HEAD > DocumentationArtifacts/app-revision.txt
          cp Package.resolved DocumentationArtifacts/Package.resolved
          xcodebuild -skipPackagePluginValidation -skipMacroValidation docbuild \
            -project liveAPP.xcodeproj -scheme liveAPP \
            -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/replykit-docc \
            -clonedSourcePackagesDirPath /tmp/replykit-docc-packages \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee DocumentationArtifacts/docbuild.log
          # 可能有多個 archive（每個有 catalog 的模組一個），全數保留。
          mkdir -p DocumentationArtifacts
          find /tmp/replykit-docc -name '*.doccarchive' -type d | sort > DocumentationArtifacts/archives.txt
          test -s DocumentationArtifacts/archives.txt
          while IFS= read -r ARCHIVE; do
            [ -n "$ARCHIVE" ] || continue
            cp -R "$ARCHIVE" DocumentationArtifacts/
          done < DocumentationArtifacts/archives.txt
          {
            echo "### docbuild 摘要（診斷 App 模組是否被建置）"
            echo "- archives: $(tr '\n' ' ' < DocumentationArtifacts/archives.txt)"
            echo '```'
            grep -Ei "compiledocumentation|catalog|error:|warning: no|fallback-default-module-kind" DocumentationArtifacts/docbuild.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Transform for static hosting (per module)
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          BASE="${GITHUB_REPOSITORY#*/}"
          MODULES=""
          while IFS= read -r ARCHIVE; do
            [ -n "$ARCHIVE" ] || continue
            MODULE="$(basename "$ARCHIVE" .doccarchive)"
            echo "→ transform $MODULE ($ARCHIVE)"
            xcrun docc process-archive transform-for-static-hosting "$ARCHIVE" \
              --output-path "site/$MODULE" --hosting-base-path "$BASE/$MODULE"
            MODULES="$MODULES $MODULE"
          done < DocumentationArtifacts/archives.txt
          touch site/.nojekyll

          # 根目錄首頁：列出各模組（仿 HaishinKit 的 docc home 設計）。
          {
            echo '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width,initial-scale=1">'
            echo '<title>ReplyKit 文件</title>'
            echo '<style>body{font:15px/1.7 -apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;max-width:760px;margin:56px auto;padding:0 24px;color:#111827;background:#fff}a{color:#2563eb}code{background:#f3f4f6;padding:2px 6px;border-radius:6px}li{margin:6px 0}</style>'
            echo '</head><body><h1>ReplyKit 文件</h1><p>由 <code>xcodebuild docbuild</code> 產生的 DocC 模組文件：</p><ul>'
            for M in $MODULES; do echo "<li><a href=\"./$M/\">$M</a></li>"; done
            echo '</ul></body></html>'
          } > site/index.html

          {
            echo "### DocC 站台結構"
            OWNER=$(printf '%s' "${GITHUB_REPOSITORY_OWNER:-owner}" | tr '[:upper:]' '[:lower:]')
            echo "- Pages 根網址：https://${OWNER}.github.io/${BASE}/"
            echo "- 模組：${MODULES:-<none>}"
            echo "- site：$(cd site && ls)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package documentation artifact (zip)
        if: always()
        run: |
          set -euo pipefail
          # doccarchive 內含 ':' 檔名（如 makebounds(_:).json），upload-artifact 不接受，
          # 故整包壓成單一 zip 上傳。
          if [ -d DocumentationArtifacts ]; then
            (cd DocumentationArtifacts && zip -qr "../documentation-${GITHUB_SHA}.zip" .)
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-${{ github.sha }}
          path: documentation-${{ github.sha }}.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
